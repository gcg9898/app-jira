<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Últimas actualizaciones - Jira Board</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f23;
            color: #e0e0e0;
            min-height: 100vh;
        }

        .header {
            background: #1a1a2e;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #2a2a4a;
        }
        .header h1 { font-size: 1.3rem; color: #16c79a; font-weight: 700; }
        .header-actions { display: flex; gap: 8px; align-items: center; }
        .btn {
            padding: 6px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-secondary { background: #2a2a4a; color: #e0e0e0; text-decoration: none; }
        .btn-secondary:hover { background: #3a3a5a; }

        .recent-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .toolbar input[type="text"] {
            flex: 1;
            min-width: 220px;
            padding: 8px 12px;
            border: 1px solid #2a2a4a;
            border-radius: 6px;
            background: #1a1a2e;
            color: #e0e0e0;
            font-size: 0.85rem;
            outline: none;
        }
        .toolbar input[type="text"]:focus { border-color: #16c79a; }
        .toolbar select {
            padding: 8px 12px;
            border: 1px solid #2a2a4a;
            border-radius: 6px;
            background: #1a1a2e;
            color: #e0e0e0;
            font-size: 0.85rem;
            cursor: pointer;
            outline: none;
        }
        .toolbar select:focus { border-color: #16c79a; }

        .results-info {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 16px;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 16px;
        }

        .task-card {
            background: #1a1a2e;
            border-radius: 8px;
            padding: 12px;
            border: 1px solid #2a2a4a;
            transition: all 0.2s;
            position: relative;
        }
        .task-card:hover { border-color: #16c79a44; transform: translateY(-1px); }
        .task-card .jira-badge {
            display: inline-block;
            background: #4A90D9;
            color: #fff;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            text-decoration: none;
        }
        .task-card .task-title {
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 4px;
            line-height: 1.3;
        }
        .task-card .task-subtitle {
            font-size: 0.8rem;
            font-weight: 500;
            color: #16c79a;
            margin-bottom: 6px;
            font-style: italic;
        }
        .task-card .task-desc {
            font-size: 0.78rem;
            color: #888;
            margin-bottom: 6px;
            line-height: 1.4;
            max-height: 120px;
            overflow: hidden;
        }
        .task-card .task-meta {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 6px;
        }
        .task-card .priority-badge {
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
        }
        .priority-most-important { background: #1a1a2e; color: #ff2d2d; border: 1.5px solid #ff2d2d; }
        .priority-high { background: #e74c3c33; color: #e74c3c; }
        .priority-medium { background: #f39c1233; color: #f39c12; }
        .priority-low { background: #2ecc7133; color: #2ecc71; }
        .task-card .last-comment {
            font-size: 0.75rem;
            color: #888;
            margin-top: 6px;
            padding: 6px 8px;
            background: #0f0f23;
            border-radius: 6px;
            border-left: 3px solid #4A90D9;
            line-height: 1.3;
            max-height: 60px;
            overflow: hidden;
        }
        .column-badge {
            display: inline-block;
            background: #2a2a4a;
            color: #aaa;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.65rem;
            font-weight: 600;
            margin-bottom: 6px;
            margin-left: 4px;
        }
        .updated-badge {
            display: inline-block;
            background: #16c79a22;
            color: #16c79a;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 700;
            margin-bottom: 6px;
            margin-left: 4px;
        }

        .task-screenshot {
            margin-top: 8px;
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
        }
        .task-screenshot img {
            width: 100%;
            height: auto;
            max-height: 180px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #2a2a4a;
            transition: opacity 0.2s;
        }
        .task-screenshot img:hover { opacity: 0.8; }

        .lightbox-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.95);
            z-index: 10000;
            overflow: auto;
            cursor: pointer;
            text-align: center;
        }
        .lightbox-overlay.active { display: block; }
        .lightbox-overlay img {
            display: inline-block;
            max-width: 95vw;
            max-height: 95vh;
            margin: 2vh auto;
            border-radius: 8px;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
            cursor: zoom-in;
        }
        .lightbox-overlay img.zoomed {
            max-width: none; max-height: none;
            width: auto; height: auto;
            cursor: zoom-out;
        }
        body.lightbox-open { overflow: hidden !important; }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #555;
            grid-column: 1 / -1;
        }
        .empty-state .icon { font-size: 3rem; margin-bottom: 12px; }
        .empty-state p { font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🕐 Últimas actualizaciones</h1>
        <div class="header-actions">
            <a href="/" class="btn btn-secondary">← Volver al Board</a>
        </div>
    </div>

    <div class="recent-container">
        <div class="toolbar">
            <input type="text" id="filterInput" placeholder="Filtrar por texto (título, clave, descripción, columna, estado)...">
            <select id="sortSelect">
                <option value="updated_desc">🕓 Últ. actualización (reciente → antigua)</option>
                <option value="updated_asc">🕓 Últ. actualización (antigua → reciente)</option>
            </select>
        </div>
        <div class="results-info" id="resultsInfo">Cargando...</div>
        <div class="results-grid" id="resultsGrid"></div>
    </div>

    <div class="lightbox-overlay" id="lightbox" onclick="closeLightbox()">
        <img id="lightboxImg" src="" onclick="toggleZoom(event)">
    </div>

    <script>
        function escapeHtml(text) {
            if (!text) return "";
            const d = document.createElement("div");
            d.textContent = text;
            return d.innerHTML;
        }

        // Same helper as board.html: extract text after "Descripción de la incidencia:"
        function extractIssueDescription(desc) {
            if (!desc) return "";
            const m = desc.match(/descripci[oó]n\s+de\s+la\s+incidencia\s*:?\s*/i);
            if (m) return desc.substring(m.index + m[0].length).trim();
            return desc;
        }

        // Parse "dd/mm/yyyy hh:mm" (as stored by sync) into a timestamp for sorting.
        function parseJiraDate(s) {
            if (!s) return 0;
            const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{1,2}))?/);
            if (!m) return 0;
            return new Date(+m[3], +m[2] - 1, +m[1], +(m[4] || 0), +(m[5] || 0)).getTime();
        }

        let allTasks = [];
        const filterInput = document.getElementById("filterInput");
        const sortSelect = document.getElementById("sortSelect");
        filterInput.addEventListener("input", render);
        sortSelect.addEventListener("change", render);

        async function loadTasks() {
            const resp = await fetch("/api/columns");
            const cols = await resp.json();
            const colName = {};
            const seen = new Set();
            allTasks = [];
            cols.forEach(c => {
                colName[c.id] = c.name;
                (c.tasks || []).forEach(t => {
                    if (t.deleted) return;
                    if (seen.has(t.id)) return;
                    seen.add(t.id);
                    t._col_name = c.name;
                    allTasks.push(t);
                });
            });
            render();
        }

        function render() {
            const grid = document.getElementById("resultsGrid");
            const info = document.getElementById("resultsInfo");
            const q = filterInput.value.trim().toLowerCase();
            const sortMode = sortSelect.value;

            let filtered = allTasks;
            if (q) {
                filtered = filtered.filter(t => {
                    const hay = [
                        t.jira_key, t.title, t.custom_title,
                        t.description, t.labels, t.last_comment,
                        t.jira_status, t._col_name
                    ].map(x => (x || "").toString().toLowerCase()).join(" ");
                    return hay.includes(q);
                });
            }

            filtered = filtered.slice().sort((a, b) => {
                const da = parseJiraDate(a.jira_updated) || parseJiraDate(a.updated_at) || 0;
                const db = parseJiraDate(b.jira_updated) || parseJiraDate(b.updated_at) || 0;
                return sortMode === "updated_asc" ? da - db : db - da;
            });

            info.textContent = q
                ? `${filtered.length} de ${allTasks.length} incidencia${allTasks.length !== 1 ? 's' : ''} — filtro: "${q}"`
                : `${filtered.length} incidencia${filtered.length !== 1 ? 's' : ''}`;

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📭</div>
                        <p>No hay incidencias que mostrar</p>
                    </div>`;
                return;
            }

            grid.innerHTML = filtered.map(renderCard).join("");
        }

        function renderCard(task) {
            const tickets = task.tickets || [];

            let priorityClass = "priority-medium";
            const p = (task.priority || "").toLowerCase();
            if (p === "most important") priorityClass = "priority-most-important";
            else if (p.includes("high") || p.includes("alta") || p.includes("critical") || p.includes("crítica") || p.includes("blocker")) priorityClass = "priority-high";
            else if (p.includes("low") || p.includes("baja")) priorityClass = "priority-low";

            const jiraBadge = task.jira_key
                ? `<a class="jira-badge" href="${escapeHtml(task.jira_url || ('https://jiraitsm.eulen.com/browse/' + task.jira_key))}" target="_blank">${escapeHtml(task.jira_key)}</a>`
                : `<span class="jira-badge" style="background:#666;">manual</span>`;

            const columnBadge = task._col_name
                ? `<span class="column-badge">📋 ${escapeHtml(task._col_name)}</span>`
                : "";

            const dateStr = task.jira_updated || task.updated_at || "";
            const updatedBadge = dateStr
                ? `<span class="updated-badge">🕐 ${escapeHtml(dateStr)}</span>`
                : "";

            const title = task.jira_key
                ? escapeHtml(task.title || "")
                : escapeHtml(task.custom_title || task.title || "");
            const subtitle = task.jira_key && task.custom_title
                ? `<div class="task-subtitle">${escapeHtml(task.custom_title)}</div>`
                : "";

            const cleanDesc = extractIssueDescription(task.description);
            const descHtml = cleanDesc ? `<div class="task-desc">${escapeHtml(cleanDesc)}</div>` : "";

            const priority = task.priority_override || task.priority || "Normal";
            const priorityBadge = `<span class="priority-badge ${priorityClass}">${escapeHtml(priority)}</span>`;
            const labelsHtml = task.labels
                ? `<span style="font-size:0.7rem;color:#888">🏷 ${escapeHtml(task.labels)}</span>`
                : "";

            const lastComment = task.last_comment
                ? `<div class="last-comment">${escapeHtml(task.last_comment.substring(0, 200))}</div>`
                : "";

            const screenshotTs = Date.now();
            const screenshotHtml = task.screenshot
                ? `<div class="task-screenshot" onclick="openLightbox('/screenshots/${encodeURIComponent(task.screenshot)}?t=${screenshotTs}')">
                       <img src="/screenshots/${encodeURIComponent(task.screenshot)}?t=${screenshotTs}" alt="Screenshot" loading="lazy">
                   </div>`
                : "";

            return `
                <div class="task-card">
                    ${jiraBadge} ${columnBadge} ${updatedBadge}
                    <div class="task-title">${title}</div>
                    ${subtitle}
                    ${descHtml}
                    <div class="task-meta">
                        ${priorityBadge}
                        ${labelsHtml}
                        ${tickets.length ? `<span style="font-size:0.7rem;color:#888">☑ ${tickets.filter(t=>t.done).length}/${tickets.length}</span>` : ""}
                        ${task.jira_status ? `<span style="font-size:0.7rem;color:#888">· ${escapeHtml(task.jira_status)}</span>` : ""}
                    </div>
                    ${screenshotHtml}
                    ${lastComment}
                </div>
            `;
        }

        function openLightbox(src) {
            const lb = document.getElementById("lightbox");
            const img = document.getElementById("lightboxImg");
            img.src = src;
            img.classList.remove("zoomed");
            lb.classList.add("active");
            document.body.classList.add("lightbox-open");
        }
        function closeLightbox() {
            document.getElementById("lightbox").classList.remove("active");
            document.body.classList.remove("lightbox-open");
        }
        function toggleZoom(e) {
            e.stopPropagation();
            document.getElementById("lightboxImg").classList.toggle("zoomed");
        }
        document.addEventListener("keydown", e => {
            if (e.key === "Escape") closeLightbox();
        });

        loadTasks();
    </script>
</body>
</html>
